name: 更新即時資料 (news + youtube)

on:
  schedule:
    - cron: "0 * * * *"      # 每小時整點自動執行(UTC)
  workflow_dispatch:          # 也可在 Actions 頁面手動按「Run workflow」
  push:
    branches: [ main ]
    paths-ignore:
      - "data/**"             # 避免機器人 commit 觸發自己

permissions:
  contents: write

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取新聞 / YouTube / IG
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/fetch_feeds.py

      - name: Commit 更新
        run: |
          git config user.name  "cheer-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/feed.json
          if git diff --staged --quiet; then
            echo "沒有變動,略過 commit。"
          else
            git commit -m "chore: 自動更新即時資料 [skip ci]"
            git push
          fi
