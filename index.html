  .brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.3px}

  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.18s}
  .icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}

  .search{display:flex;align-items:center;gap:11px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-sm)}
  .search:focus-within{border-color:var(--accent)}
  .search svg{width:20px;height:20px;fill:var(--soft);flex:none}
  .search input{flex:1;background:0;border:0;outline:0;color:var(--text);font-size:16px}

  .launch button:hover,.launch button:focus-visible{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);outline:none}
  .hint{color:var(--muted);font-size:12px;margin-top:9px;line-height:1.5}

  main{max-width:1160px;margin:0 auto;padding:20px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px}
  .tab{flex:none;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:11px;padding:9px 15px;font-weight:800;font-size:13.5px;display:flex;gap:8px;align-items:center;white-space:nowrap;transition:.15s}
  .tab .dot{width:9px;height:9px;border-radius:50%}
  .tab:hover{color:var(--text);border-color:var(--accent)}
  .tab.active{color:#fff;border-color:transparent;box-shadow:var(--shadow-sm)}

  .sec-title{display:flex;align-items:baseline;gap:11px;margin:30px 2px 15px;font-size:16.5px;font-weight:800}

  .newsitem{display:block;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;transition:.15s;box-shadow:var(--shadow-sm)}

function timeAgo(str){
  const d=new Date(str); if(isNaN(d)) return "";
  const s=(Date.now()-d.getTime())/1000;
  if(s<3600) return Math.max(1,Math.floor(s/60))+" 分鐘前";
  if(s<86400) return Math.floor(s/3600)+" 小時前";
  return Math.floor(s/86400)+" 天前";
}

/* ===== 頁內即時搜尋(透過 Cloudflare Worker,不轉跳) ===== */
async function inlineSearch(kind, term){
  searchResults={kind, term, items:null, error:0};
  window.scrollTo(0,0); render();
  try{
    const r=await fetch(`${WORKER}/${kind}?q=`+encodeURIComponent(term));
    const d=await r.json();
    if(searchResults && searchResults.term===term){ searchResults.kind=kind; searchResults.items=d.items||[]; render(); }
  }catch(e){ if(searchResults){ searchResults.items=[]; searchResults.error=1; render(); } }
}
function closeResults(){ searchResults=null; render(); }
function renderResults(){
  const r=searchResults;
  const head=`<div class="rhead"><b>頁內搜尋 · <span class="q">${esc(r.term)}</span></b><button class="close" data-close="1">✕ 關閉</button></div>
    <div class="rtabs"><button data-rk="news" class="${r.kind==='news'?'on':''}">📰 新聞</button><button data-rk="youtube" class="${r.kind==='youtube'?'on':''}">▶️ YouTube</button></div>`;
  let body;
  if(r.items===null) body=`<div class="rloading">🔎 搜尋中…</div>`;
  else if(!r.items.length) body=`<div class="rloading">${r.error?'⚠️ 搜尋失敗,請確認 Worker 網址正確':'沒有結果'}</div>`;
  else if(r.kind==='news') body=newsList(r.items);
  else body=`<div class="ytres">${r.items.map(v=>`<div class="ythumb" data-vid="${v.id}"><div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><div class="play">▶</div></div><div class="tt">${esc(v.title)}</div></div>`).join("")}</div>`;
  return `<div class="results">${head}${body}</div>`;
}
function attachResultHandlers(){
  document.querySelectorAll(".results [data-close]").forEach(b=>b.onclick=closeResults);
  document.querySelectorAll(".results .rtabs [data-rk]").forEach(b=>b.onclick=()=>inlineSearch(b.dataset.rk, searchResults.term));
  document.querySelectorAll(".ythumb").forEach(el=>el.onclick=()=>{
    el.querySelector(".thumb").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${el.dataset.vid}?autoplay=1" title="video" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;
  });
}

    html+=`<div class="sec-title"><span class="bar"></span>${t.zh} · 即時新聞 <small>每小時自動更新</small></div>`+newsList(FEED&&FEED.news?FEED.news[view]:null);

$("#themeBtn").onclick=()=>{const next=effTheme()==="dark"?"light":"dark";root.setAttribute("data-theme",next);localStorage.setItem("cheer-theme",next);updThemeBtn();};
$("#foot").innerHTML=`<b>台灣啦啦隊搜尋引擎</b> · 即時新聞(Bing News,依時間×重要度排序、附摘要)與 YouTube 由機器人每小時自動更新。
${WORKER?'頁內即時搜尋:<b>已啟用</b> ✅':'<a href="javascript:void(0)" onclick="setWorker()" style="color:var(--accent);font-weight:800">⚙️ 設定即時搜尋(Cloudflare Worker)</a> — 啟用後新聞/YouTube 搜尋結果直接顯示在頁面。'}
成員名錄為 2026 賽季快照,社群按鈕即時連向真實來源。資料來源:Bing News、YouTube、ShowLove 女神百科、cpblgirls、CPBL 官方 等。頭像為色塊佔位(非真實照片)。`;

function setUpd(){ $("#updtxt").textContent=(FEED&&FEED.updated)?("即時 · 更新於 "+timeAgo(FEED.updated)):"即時資料載入中…"; }
updThemeBtn();
fetch("data/feed.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(d=>{FEED=d;setUpd();render();}).catch(()=>{setUpd();render();});
render();
