  {t:"📰 新聞",u:`https://news.google.com/search?q=${g(t.zh+" "+t.team)}&hl=zh-TW&gl=TW`},
  {t:"▶️ YouTube",u:`https://www.youtube.com/results?search_query=${g(t.zh)}`},
  {t:"📸 IG",u:`https://www.google.com/search?q=${g(t.zh+" instagram 官方")}`},
  {t:"📘 FB",u:`https://www.facebook.com/search/top?q=${g(t.zh)}`},
  {t:"🧵 Threads",u:`https://www.threads.net/search?q=${g(t.zh)}`},
  {t:"📅 班表",u:`https://lala.pythings.dev/`},
];}

function renderTabs(){
  const tabs=[{id:"live",zh:"🔴 即時",color:"#ff3b3b"},{id:"all",zh:"全部隊員",color:"#ff4d8d"},...TEAMS,{id:"sources",zh:"資訊源",color:"#5cc8ff"}];
  $("#tabs").innerHTML=tabs.map(t=>{
    const a=t.id===view;
    return `<div class="tab ${a?'active':''}" data-id="${t.id}" style="${a?`background:${t.grad?gc(t):'linear-gradient(135deg,#ff4d8d,#5cc8ff)'};`:''}"><span class="dot" style="background:${t.color||'#888'}"></span>${t.zh||t.name}</div>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>{view=el.dataset.id;window.scrollTo(0,0);render();});
}
function newsList(items){
  if(!items||!items.length) return `<div class="empty">${FEED?'目前沒有相關新聞':'⏳ 新聞由機器人每小時更新;若剛部署,稍候即會出現。'}</div>`;
  return `<div class="news">${items.map(n=>`<a class="newsitem" href="${esc(n.link)}" target="_blank" rel="noopener">
    <p class="t">${esc(n.title)}</p><div class="m"><span class="src">${esc(n.source)||'新聞'}</span><span>${timeAgo(n.pub)}</span></div></a>`).join("")}</div>`;
}
function ytBlock(tid){
  const y=FEED&&FEED.youtube&&FEED.youtube[tid];
  if(!y||!y.videos||!y.videos.length) return "";
  const t=T(tid), v=y.videos[0];
  return `<div class="ytcard">
    <div class="cap">${t.emo} ${t.zh} <span class="live">最新</span></div>
    <div class="ytframe"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${v.id}" title="${esc(v.title)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>
    <div class="row"><a href="${y.channelUrl}/streams" target="_blank" rel="noopener">🔴 看直播</a><a href="${y.channelUrl}/videos" target="_blank" rel="noopener">📺 更多影片</a></div>
  </div>`;
}
function renderLive(){
  const news=FEED&&FEED.news?FEED.news.all:null;
  const yts=TEAMS.map(t=>ytBlock(t.id)).filter(Boolean).join("");
  return `<div class="sec-title"><span class="bar"></span>🔴 即時新聞 <small>機器人每小時自動抓取 · 點擊看原文</small></div>
    ${newsList(news)}
    ${yts?`<div class="sec-title"><span class="bar"></span>📺 各隊最新影片 / 直播 <small>YouTube 官方頻道</small></div><div class="ytgrid">${yts}</div>`:''}
    <div class="sec-title"><span class="bar"></span>🔎 快速搜尋 <small>把任何關鍵字送到各平台</small></div>
    <div class="teamgrid">${TEAMS.map(t=>`<div class="teamcard"><div class="top" style="background:${gc(t)}"><div class="emo">${t.emo}</div><h3>${t.zh}</h3><div class="en">${t.name}</div></div><div class="links">${teamLinks(t).slice(0,6).map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.t}</a>`).join("")}</div></div>`).join("")}</div>`;
}
function memberCard(m){
  const t=T(m.t);
  return `<div class="card" data-i="${M.indexOf(m)}">${flag(m.r)?`<div class="flag">${flag(m.r)}</div>`:''}<div class="av" style="background:${gc(t)}">${initials(m.n)}</div><div class="b"><p class="n">${m.n}</p><p class="r">${t.zh}${m.r?' · '+m.r:''}</p></div></div>`;
}
function filtered(){
  const q=query.trim().toLowerCase();
  return M.filter(m=>{
    const t=T(m.t);
    const okV=(view==="all"||view==="live")||m.t===view;
    const okQ=!q||m.n.toLowerCase().includes(q)||(m.r||"").toLowerCase().includes(q)||t.zh.toLowerCase().includes(q)||t.name.toLowerCase().includes(q)||t.team.toLowerCase().includes(q);
    return okV&&okQ;
  });
}
function renderTeamHubs(){
  return `<div class="sec-title"><span class="bar"></span>六隊入口 <small>官方 / 百科 / 新聞 / 直播 / 班表</small></div><div class="teamgrid">${TEAMS.map(t=>`<div class="teamcard"><div class="top" style="background:${gc(t)}"><div class="emo">${t.emo}</div><h3>${t.zh}</h3><div class="en">${t.name}</div><div class="team">所屬球隊 · ${t.team}</div></div><div class="links">${teamLinks(t).map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.t}</a>`).join("")}</div></div>`).join("")}</div>`;
}
function renderMembers(){
  const list=filtered();
  const head=`<div class="sec-title"><span class="bar"></span>${(view==="all"||view==="live")?"主要成員名錄":T(view).zh+" 成員"} <small>2026 快照 · 完整最新名單請點「百科」</small></div><div class="count">顯示 ${list.length} 位 · 點卡片一鍵直達本人社群</div>`;
  const body=list.length?`<div class="grid">${list.map(memberCard).join("")}</div>`:`<div class="empty">🔍 名錄中沒有「${esc(query)}」<br><small>試試上方按鈕到新聞 / IG / 百科即時搜尋</small></div>`;
  return head+body;
}
function renderSources(){
  const src=`<div class="sec-title"><span class="bar"></span>資訊源聚合 <small>新聞 · 社群 · 班表 · 論壇 · 百科</small></div><div class="srcgrid">${SOURCES.map(gp=>`<div class="srcgroup"><h4>${gp.group}</h4>${gp.items.map(it=>`<a href="${it.u}" target="_blank" rel="noopener"><span class="ic">${it.ic}</span><span class="meta"><b>${it.t}</b><span>${it.d}</span></span><span class="go">↗</span></a>`).join("")}</div>`).join("")}</div>`;
  const live=`<div class="sec-title"><span class="bar"></span>各隊直播入口 <small>YouTube 應援直播 / 頻道</small></div><div class="teamgrid">${TEAMS.map(t=>`<div class="teamcard"><div class="top" style="background:${gc(t)}"><div class="emo">${t.emo}</div><h3>${t.zh}</h3><div class="en">LIVE / 頻道</div></div><div class="links"><a href="https://www.youtube.com/results?search_query=${g(t.zh+' live')}" target="_blank" rel="noopener">▶️ 直播搜尋</a><a href="https://www.youtube.com/results?search_query=${g(t.zh)}" target="_blank" rel="noopener">📺 頻道 / 精華</a><a href="https://www.cpbl.com.tw/schedule" target="_blank" rel="noopener">⚾ 今日賽程</a></div></div>`).join("")}</div>`;
  return src+live;
}
function render(){
  renderTabs();renderLaunch();
  let html="";
  if(view==="live") html=renderLive()+renderMembers();
  else if(view==="sources") html=renderSources();
  else if(view==="all") html=renderTeamHubs()+renderMembers();
  else {
    const t=T(view);
    html=`<div class="sec-title"><span class="bar"></span>${t.zh} · 即時新聞 <small>每小時自動更新</small></div>`+newsList(FEED&&FEED.news?FEED.news[view]:null);
    const yt=ytBlock(view); if(yt) html+=`<div class="sec-title"><span class="bar"></span>最新影片 / 直播</div><div class="ytgrid">${yt}</div>`;
    html+=`<div class="sec-title"><span class="bar"></span>${t.zh} 入口</div><div class="teamgrid"><div class="teamcard"><div class="top" style="background:${gc(t)}"><div class="emo">${t.emo}</div><h3>${t.zh}</h3><div class="en">${t.name}</div><div class="team">所屬球隊 · ${t.team}</div></div><div class="links">${teamLinks(t).map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.t}</a>`).join("")}</div></div></div>`;
    html+=renderMembers();
  }
  $("#view").innerHTML=html;
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openModal(+c.dataset.i));
}
function openModal(i){
  const m=M[i],t=T(m.t),term=`${m.n} ${t.zh}`;
  const ig=m.ig?`https://www.instagram.com/${m.ig}/`:`https://www.google.com/search?q=${g(m.n+' '+t.zh+' site:instagram.com')}`;
  const socials=[
    {em:"📸",l:m.ig?"IG @"+m.ig:"IG貼文",u:ig},
    {em:"🧵",l:"Threads",u:`https://www.google.com/search?q=${g(m.n+' '+t.zh+' site:threads.net')}`},
    {em:"📰",l:"新聞",u:`https://news.google.com/search?q=${g(term)}&hl=zh-TW&gl=TW`},
    {em:"▶️",l:"YouTube",u:`https://www.youtube.com/results?search_query=${g(term)}`},
    {em:"📘",l:"FB貼文",u:`https://www.google.com/search?q=${g(m.n+' '+t.zh+' site:facebook.com')}`},
    {em:"💖",l:"百科",u:`https://cheer.showlove.me/?s=${g(m.n)}`},
  ];
  $("#modal").innerHTML=`<div class="hero" style="background:${gc(t)}">${initials(m.n)}<button class="x" onclick="closeModal()">✕</button></div><div class="body"><h2>${m.n} ${flag(m.r)}</h2><p class="sub">${t.zh} · ${t.name}</p><p class="tagline">${m.r||'成員'} · 所屬球隊 ${t.team}</p><div class="socials">${socials.map(s=>`<a href="${s.u}" target="_blank" rel="noopener"><span class="em">${s.em}</span>${s.l}</a>`).join("")}</div><p class="note">🔄 名單會隨賽季加入 / 退出 / 轉隊變動。以上連結皆為<b>即時開啟真實來源</b>。${m.ig?'':'※ 此成員 IG 以 Google 即時搜尋帶出,避免帳號變動失效。'}</p></div>`;
  $("#overlay").classList.add("show");
}
function closeModal(){$("#overlay").classList.remove("show");}
window.closeModal=closeModal;
$("#overlay").onclick=e=>{if(e.target.id==="overlay")closeModal();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
$("#q").addEventListener("input",e=>{query=e.target.value;render();});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&query.trim())openU(PLATFORMS[0].f(query.trim()));});
$("#foot").innerHTML=`<b>台灣啦啦隊搜尋引擎</b> · 即時新聞 / YouTube 由 GitHub Actions 機器人每小時自動更新。成員名錄為 2026 賽季快照,所有社群按鈕即時連向真實來源。資料來源:Google News、YouTube、ShowLove 女神百科、cpblgirls、CPBL 官方 等。頭像為色塊佔位(非真實照片)。`;

function setUpd(){
  if(FEED&&FEED.updated){ $("#updtxt").textContent="即時資料 · 更新於 "+timeAgo(FEED.updated); }
  else { $("#updtxt").textContent="即時資料載入中…"; }
}
fetch("data/feed.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(d=>{FEED=d;setUpd();render();})
  .catch(()=>{setUpd();render();});
render();
</script>
</body>
</html>
